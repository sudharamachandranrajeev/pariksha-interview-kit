name: ui_kit
description: "Shared motion and components for the Brahma apps, recoloured per app through a KitPalette ThemeExtension. No native speech libraries and no brahma_core."
version: 0.0.1
publish_to: 'none'
repository: https://github.com/sudharamachandranrajeev/pariksha-interview-kit

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.0'

# Versions as in Udyoga, the app the kit is extracted from.
dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  shadcn_ui: ^0.59.0
  smooth_sheets: ^1.3.1
  toastification: ^3.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
